# SonarQube Configuration for EuaConnecta 2.0
# ==========================================
# This file configures SonarQube analysis for code quality

sonar.projectKey=euaconecta-2.0
sonar.projectName=EuaConnecta 2.0
sonar.projectVersion=2.0.0

# Source code
sonar.sources=src
sonar.tests=__tests__,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.config.js,**/*.config.ts,node_modules/**,.next/**,out/**,build/**,dist/**,coverage/**,.nyc_output/**,logs/**,docs/**,scripts/**,docker/**

# Test coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=test-results.xml

# TypeScript
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Code analysis
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Quality Gates
sonar.qualitygate.wait=true

# Additional settings
sonar.host.url=https://sonarcloud.io
sonar.organization=euaconecta

# Coverage settings
sonar.coverage.exclusions=**/*.config.*,**/*.d.ts,**/*.stories.*,**/mocks/**,**/fixtures/**

# Duplications
sonar.cpd.exclusions=**/*.test.*,**/*.spec.*,**/mocks/**,**/fixtures/**

# Security hotspots
sonar.security.config.javasecurity=java-security-sensitive-rules.xml

# Custom rules
sonar.typescript.eslint.reportPaths=eslint-report.json