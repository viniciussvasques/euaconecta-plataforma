<!-- Estamos criando um marcador de imagem SVG simples -->
<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f1f5f9; }
    .header { fill: #3b82f6; }
    .card { fill: white; stroke: #e2e8f0; stroke-width: 1; }
    .text { fill: #64748b; }
    .text-primary { fill: #1e293b; }
    .text-white { fill: white; }
    .chart { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1; }
    .chart-line { stroke: #3b82f6; stroke-width: 2; fill: none; }
    .chart-point { fill: #3b82f6; }
    .sidebar { fill: #1e293b; }
    .menu-item { fill: #475569; }
    .accent { fill: #22c55e; }
  </style>

  <!-- Background -->
  <rect width="800" height="450" class="bg" rx="8" />

  <!-- Sidebar -->
  <rect x="10" y="10" width="150" height="430" class="sidebar" rx="6" />
  
  <!-- Logo -->
  <text x="40" y="40" font-family="Arial" font-size="18" class="text-white" font-weight="bold">EuaConecta</text>
  
  <!-- Menu Items -->
  <rect x="20" y="70" width="130" height="40" class="menu-item" rx="4" />
  <text x="60" y="95" font-family="Arial" font-size="12" class="text-white">Dashboard</text>
  
  <rect x="20" y="120" width="130" height="30" rx="4" opacity="0.6" class="menu-item" />
  <text x="60" y="140" font-family="Arial" font-size="12" class="text-white">Pacotes</text>
  
  <rect x="20" y="160" width="130" height="30" rx="4" opacity="0.6" class="menu-item" />
  <text x="60" y="180" font-family="Arial" font-size="12" class="text-white">Envios</text>
  
  <rect x="20" y="200" width="130" height="30" rx="4" opacity="0.6" class="menu-item" />
  <text x="60" y="220" font-family="Arial" font-size="12" class="text-white">Financeiro</text>
  
  <rect x="20" y="240" width="130" height="30" rx="4" opacity="0.6" class="menu-item" />
  <text x="60" y="260" font-family="Arial" font-size="12" class="text-white">Relatórios</text>

  <!-- Main Content -->
  <!-- Header -->
  <rect x="170" y="10" width="620" height="60" class="header" rx="6" />
  <text x="190" y="45" font-family="Arial" font-size="20" class="text-white" font-weight="bold">Painel Principal</text>
  
  <!-- Statistics Cards -->
  <rect x="170" y="80" width="190" height="100" class="card" rx="6" />
  <text x="190" y="110" font-family="Arial" font-size="14" class="text">Total de Pacotes</text>
  <text x="190" y="145" font-family="Arial" font-size="24" class="text-primary" font-weight="bold">125</text>
  
  <rect x="380" y="80" width="190" height="100" class="card" rx="6" />
  <text x="400" y="110" font-family="Arial" font-size="14" class="text">Em Trânsito</text>
  <text x="400" y="145" font-family="Arial" font-size="24" class="text-primary" font-weight="bold">42</text>
  
  <rect x="590" y="80" width="200" height="100" class="card" rx="6" />
  <text x="610" y="110" font-family="Arial" font-size="14" class="text">Entregues</text>
  <text x="610" y="145" font-family="Arial" font-size="24" class="text-primary" font-weight="bold">83</text>

  <!-- Chart -->
  <rect x="170" y="190" width="620" height="250" class="card" rx="6" />
  <text x="190" y="220" font-family="Arial" font-size="16" class="text-primary" font-weight="bold">Atividade de Pacotes</text>
  
  <rect x="190" y="240" width="580" height="170" class="chart" rx="4" />
  <polyline points="190,380 250,340 310,360 370,320 430,280 490,300 550,260 610,240 670,230 730,210" class="chart-line" />
  <circle cx="250" cy="340" r="4" class="chart-point" />
  <circle cx="310" cy="360" r="4" class="chart-point" />
  <circle cx="370" cy="320" r="4" class="chart-point" />
  <circle cx="430" cy="280" r="4" class="chart-point" />
  <circle cx="490" cy="300" r="4" class="chart-point" />
  <circle cx="550" cy="260" r="4" class="chart-point" />
  <circle cx="610" cy="240" r="4" class="chart-point" />
  <circle cx="670" cy="230" r="4" class="chart-point" />
  <circle cx="730" cy="210" r="4" class="chart-point" />

  <!-- X axis labels -->
  <text x="250" y="400" font-family="Arial" font-size="10" class="text" text-anchor="middle">Jan</text>
  <text x="310" y="400" font-family="Arial" font-size="10" class="text" text-anchor="middle">Fev</text>
  <text x="370" y="400" font-family="Arial" font-size="10" class="text" text-anchor="middle">Mar</text>
  <text x="430" y="400" font-family="Arial" font-size="10" class="text" text-anchor="middle">Abr</text>
  <text x="490" y="400" font-family="Arial" font-size="10" class="text" text-anchor="middle">Mai</text>
  <text x="550" y="400" font-family="Arial" font-size="10" class="text" text-anchor="middle">Jun</text>
  <text x="610" y="400" font-family="Arial" font-size="10" class="text" text-anchor="middle">Jul</text>
  <text x="670" y="400" font-family="Arial" font-size="10" class="text" text-anchor="middle">Ago</text>
  <text x="730" y="400" font-family="Arial" font-size="10" class="text" text-anchor="middle">Set</text>
</svg>