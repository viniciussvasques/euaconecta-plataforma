version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: euaconecta-api
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/euaconecta?schema=public
    command: npm run dev

  db:
    image: postgres:15-alpine
    container_name: euaconecta-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=euaconecta
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: